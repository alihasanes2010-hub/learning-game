<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة العقل الباحث - لعبة تفاعلية</title>
    <!-- مكتبة التأثيرات الملونة (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #1e3d59;
            --accent: #17b978;
            --bg: #eef2f5;
            --wrong: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .game-container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.4s ease;
        }

        /* Flashcard Styles */
        .card-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
            display: block;
        }

        .card-container {
            perspective: 1000px;
            height: 160px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .card-front {
            background: linear-gradient(135deg, #1e3d59, #17b978);
            color: white;
            font-weight: bold;
        }

        .card-back {
            background: #fff;
            border: 2px solid var(--accent);
            color: #222;
            transform: rotateY(180deg);
        }

        /* Quiz Styles */
        .quiz-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #e2e8f0;
        }

        .question {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1e293b;
        }

        .options button {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            border: 2px solid #cbd5e1;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            text-align: right;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .options button:hover:not(:disabled) {
            border-color: var(--accent);
            background: #f0fdf4;
            transform: translateY(-2px);
        }

        .options button.correct {
            background: #dcfce7 !important;
            border-color: var(--accent) !important;
            color: #166534;
            font-weight: bold;
            animation: pulse 0.5s ease;
        }

        .options button.wrong {
            background: #fee2e2 !important;
            border-color: var(--wrong) !important;
            color: #991b1b;
            animation: shake 0.4s ease;
        }

        /* Character & Animations */
        .character-box {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 75px;
            height: 75px;
            pointer-events: none;
            z-index: 10;
        }

        .avatar {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.2s;
        }

        .clapping {
            animation: clap 0.6s infinite alternate;
        }

        /* Keyframes */
        @keyframes clap {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.15) rotate(-5deg); }
            100% { transform: scale(1.15) rotate(5deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .hint-text {
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>رحلة العقل الباحث ⛵</h1>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <div id="game-body">
        <!-- Flashcard for Current Question -->
        <div class="card-section">
            <span class="section-title">💡 المفهوم الخاص بالسؤال (اضغط على البطاقة لقلبها):</span>
            <div class="card-container" onclick="flipCard()">
                <div class="card" id="flashcard">
                    <div class="card-front" id="card-concept">جاري تحميل الفكرة...</div>
                    <div class="card-back" id="card-detail">جاري تحميل الشرح...</div>
                </div>
            </div>
            <div class="hint-text">اقرأ الفكرة الشارحة جيداً ثم أجب عن السؤال أدناه 👇</div>
        </div>

        <!-- Quiz Block -->
        <div class="quiz-section">
            <div class="question" id="quiz-question">جاري تحميل السؤال...</div>
            <div class="options" id="quiz-options"></div>
        </div>
    </div>

    <!-- Companion Character -->
    <div class="character-box">
        <svg id="avatar-svg" viewBox="0 0 100 100" class="avatar">
            <!-- SVG Guide Character -->
            <circle cx="50" cy="50" r="40" fill="#facc15" />
            <circle cx="35" cy="40" r="5" fill="#1e293b" />
            <circle cx="65" cy="40" r="5" fill="#1e293b" />
            <path d="M 35 65 Q 50 80 65 65" stroke="#1e293b" stroke-width="4" fill="none" id="smile" />
            <path d="M 10 50 Q 0 30 20 20" stroke="#facc15" stroke-width="8" stroke-linecap="round" fill="none" id="hand-l" />
            <path d="M 90 50 Q 100 30 80 20" stroke="#facc15" stroke-width="8" stroke-linecap="round" fill="none" id="hand-r" />
        </svg>
    </div>
</div>

<script>
    // Full Data Matched with Slide Concepts
    const gameData = [
        {
            conceptTitle: "الحد الفاصل للإنسان",
            conceptDetail: "يتميز الإنسان بأنه جسم نامٍ، حساس، متحرّك بالإرادة، ولكن الحد الفاصل الحقيقي الذي يميّزه عن بقية الحيوانات هو 'العقل'.",
            question: "ما هو الحد الفاصل والتام بين الإنسان والحيوان؟",
            options: ["الحس واللمس", "النمو والحركة", "العقل والمدركات الكلية", "الخيال والتصوّر"],
            correct: 2
        },
        {
            conceptTitle: "أدوات المعرفة: الوهم",
            conceptDetail: "الوهم كأداة معرفية هو إدراك المفاهيم الجزئية؛ مثل حنّو الأم على طفلها، أو خوف الشاة وإدراكها لعداوة الذئب.",
            question: "إدراك الشاة لعداوة الذئب يُعدّ مثالاً على أي أداة من أدوات المعرفة؟",
            options: ["أداة الحس", "أداة الوهم", "أداة الخيال", "أداة العقل"],
            correct: 1
        },
        {
            conceptTitle: "دليل النظام (إثبات الخالق)",
            conceptDetail: "يستحيل عقلاً تحقّق نظام متوازن ومترابط يؤدي هدفاً محدداً في هذا الكون الفسيح دون وجود قوة عالمة وقاصدة وحكيمة.",
            question: "يقوم 'دليل النظام' على فكرة أساسية وهي أن الكون:",
            options: ["تكوّن بالصدفة العشوائية", "يخضع لنظام دقيق يستحيل تحققه بلا خالق حكيم", "وجد نفسه بنفسه عبر الزمن", "مترابط ولكن ليس له أي هدف"],
            correct: 1
        },
        {
            conceptTitle: "الهدف من الخلق",
            conceptDetail: "بما أن الله تعالى 'غنيّ' لا يحتاج أحداً، وهو 'حكيم' لا يفعل عبثاً؛ فإن الهدف من خلق الإنسان هو الوصول لـ 'كماله وتكامله'.",
            question: "ما هو الهدف الأساسي من خلق الإنسان وفق الاستدلال العقلي؟",
            options: ["حاجة الخالق سبحانه إلى من يعبده", "العبث والتسلية في الحياة", "تكامل الإنسان والوصول إلى كماله", "البقاء المادي فقط"],
            correct: 2
        },
        {
            conceptTitle: "دليل المعجزة",
            conceptDetail: "المعجزة أمر خارق للعادة الطبيعية يأتي به مدّعي النبوة للتحدي، ويُعجز البشر عن الإتيان بمثله إثباتاً لتواصله الإلهي.",
            question: "أيّ مما يلي يُعدّ من الشروط الأساسية للمعجزة؟",
            options: ["أن تكون أمراً طبيعياً يستطيع أي شخص تقليده", "أن تكون خارقة للأسباب الطبيعية ويعجز الناس عنها", "أن لا تتطابق مع دعوى الشخص", "أن تكون تجربة علمية مخبرية"],
            correct: 1
        },
        {
            conceptTitle: "الموقف العملي في عصر التمهيد",
            conceptDetail: "وظيفة المؤمن تتلخص في مسارين: السعي للكمال الفردي (الالتزام والتقوى)، والتكامل الاجتماعي (تهيئة البيئة والتمهيد للعدالة).",
            question: "تتحدد وظيفة المؤمن في هذا العصر من خلال:",
            options: ["السعي للكمال الفردي والتكامل الاجتماعي معاً", "الانتظار السلبي دون عمل أي شيء", "الاهتمام بالنفس وإهمال المجتمع", "اعتزال الناس تماماً"],
            correct: 0
        }
    ];

    let currentIndex = 0;
    let score = 0;

    function flipCard() {
        document.getElementById('flashcard').classList.toggle('flipped');
    }

    function loadStage() {
        if (currentIndex >= gameData.length) {
            showFinalResults();
            return;
        }

        // Reset Card State
        const card = document.getElementById('flashcard');
        card.classList.remove('flipped');

        const current = gameData[currentIndex];

        // Update Progress Bar
        const progressPercent = (currentIndex / gameData.length) * 100;
        document.getElementById('progress').style.width = `${progressPercent}%`;

        // Update Card Contents after slight delay for smooth visual feel
        setTimeout(() => {
            document.getElementById('card-concept').innerText = current.conceptTitle;
            document.getElementById('card-detail').innerText = current.conceptDetail;
        }, 150);

        // Update Quiz Contents
        document.getElementById('quiz-question').innerText = `${currentIndex + 1}. ${current.question}`;
        const optionsDiv = document.getElementById('quiz-options');
        optionsDiv.innerHTML = '';

        current.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(idx, current.correct, btn);
            optionsDiv.appendChild(btn);
        });
    }

    function handleAnswer(selectedIndex, correctIndex, btn) {
        const buttons = document.querySelectorAll('.options button');
        buttons.forEach(b => b.disabled = true);

        const avatar = document.getElementById('avatar-svg');

        if (selectedIndex === correctIndex) {
            btn.classList.add('correct');
            score++;
            
            // Trigger Animation & Clapping
            avatar.classList.add('clapping');
            confetti({
                particleCount: 50,
                spread: 60,
                origin: { y: 0.8 }
            });

            setTimeout(() => avatar.classList.remove('clapping'), 1200);
        } else {
            btn.classList.add('wrong');
            buttons[correctIndex].classList.add('correct');
        }

        setTimeout(() => {
            currentIndex++;
            loadStage();
        }, 1800);
    }

    function showFinalResults() {
        document.getElementById('progress').style.width = '100%';
        document.getElementById('game-body').innerHTML = `
            <div style="text-align: center; padding: 30px 10px;">
                <h2 style="color: var(--primary); font-size: 2rem;">أحسنت! أتممت الرحلة بنجاح 🏆</h2>
                <p style="font-size: 1.3rem; margin: 20px 0;">نتيجة اختبارك النهائي: <strong>${score} من ${gameData.length}</strong></p>
                <button onclick="location.reload()" style="padding: 12px 30px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; font-weight: bold;">إعادة اللعبة 🔄</button>
            </div>
        `;
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
    }

    // Initialize Game
    loadStage();
</script>

</body>
</html>
