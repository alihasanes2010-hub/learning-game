<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة العقل الباحث - Emerald Edition</title>
    <style>
        :root {
            --bg-dark: #05130b;
            --emerald-base: #0a2718;
            --emerald-glow: #00ff88;
            --gold-bright: #ffe58f;
            --gold-mid: #d4af37;
            --gold-dark: #7a5c1e;
            --text-gold: #f7e7c4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Amiri', 'Georgia', serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(10, 39, 24, 0.8) 0%, rgba(5, 19, 11, 0.98) 100%),
                repeating-radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.03) 0, rgba(212, 175, 55, 0.03) 1px, transparent 1px, transparent 20px);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-gold);
            padding: 15px;
            overflow-x: hidden;
        }

        .main-stage {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Top Centered Watch Crest */
        .crest-watch-wrapper {
            position: relative;
            z-index: 10;
            margin-bottom: -35px;
            cursor: pointer;
        }

        .pocket-watch {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #2a5a3f 0%, #06190f 80%);
            border: 4px solid var(--gold-mid);
            box-shadow: 
                0 0 0 2px var(--gold-dark),
                0 0 20px rgba(0, 0, 0, 0.9),
                inset 0 0 15px rgba(255, 229, 143, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pocket-watch::before {
            content: '';
            position: absolute;
            top: -12px;
            width: 20px;
            height: 12px;
            border: 3px solid var(--gold-mid);
            border-bottom: none;
            border-radius: 6px 6px 0 0;
        }

        .pocket-watch:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
        }

        .watch-lock-icon {
            font-size: 2rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        /* Question Frame Structure */
        .question-frame {
            width: 100%;
            position: relative;
            background: linear-gradient(180deg, #0d3320 0%, #06180e 100%);
            border: 3px solid var(--gold-mid);
            border-radius: 25px;
            padding: 55px 30px 30px 30px;
            box-shadow: 
                0 0 30px rgba(0, 0, 0, 0.9),
                inset 0 0 25px rgba(0, 0, 0, 0.8),
                inset 0 0 2px var(--gold-bright);
            text-align: center;
        }

        /* Gems Layout */
        .gems-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            border-radius: 22px;
        }

        .facet-gem {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #091a11;
            border: 2px solid var(--gold-dark);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            transition: all 0.6s ease;
            opacity: 0.4;
        }

        .facet-gem.active {
            background: radial-gradient(circle, #aaffcc 0%, var(--emerald-glow) 60%, #006633 100%);
            border-color: #ffffff;
            opacity: 1;
            box-shadow: 0 0 20px var(--emerald-glow);
            filter: drop-shadow(0 0 8px var(--emerald-glow));
        }

        /* Individual Gem Positions */
        .gem-1 { top: 15px; left: 20px; }
        .gem-2 { top: 15px; right: 20px; }
        .gem-3 { top: 50%; left: 12px; transform: translateY(-50%); }
        .gem-4 { top: 50%; right: 12px; transform: translateY(-50%); }
        .gem-5 { bottom: 15px; left: 20px; }
        .gem-6 { bottom: 15px; right: 20px; }

        .question-header-tag {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: var(--gold-bright);
            margin-bottom: 12px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .question-body-text {
            font-size: 1.35rem;
            line-height: 1.7;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
            max-width: 800px;
            margin: 0 auto;
        }

        /* MCQ Options Layout */
        .answers-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .answer-card {
            background: linear-gradient(180deg, #103a24 0%, #071c11 100%);
            border: 2px solid var(--gold-mid);
            border-radius: 12px;
            padding: 18px 10px;
            color: var(--text-gold);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.5);
            text-align: center;
        }

        .answer-card::before {
            content: '♦';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            color: var(--gold-bright);
        }

        .answer-card:hover:not(:disabled) {
            border-color: var(--gold-bright);
            background: linear-gradient(180deg, #1b5737 0%, #0c2b1a 100%);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        .answer-card.correct {
            background: linear-gradient(180deg, #19663b 0%, #0a331d 100%) !important;
            border-color: var(--emerald-glow) !important;
            color: #ffffff !important;
            box-shadow: 0 0 20px var(--emerald-glow) !important;
        }

        .answer-card.wrong {
            background: linear-gradient(180deg, #661919 0%, #330a0a 100%) !important;
            border-color: #ff4d4d !important;
            color: #ffffff !important;
        }

        /* Unlock Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: linear-gradient(135deg, #0f3822 0%, #05140c 100%);
            border: 3px solid var(--gold-bright);
            border-radius: 18px;
            padding: 30px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.4);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            color: var(--gold-bright);
            font-size: 1.35rem;
            margin-bottom: 15px;
        }

        .modal-body {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #e2f0e8;
            margin-bottom: 25px;
        }

        .close-btn {
            background: linear-gradient(135deg, #ffe58f 0%, #d4af37 100%);
            border: none;
            color: #05130b;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Responsive Breakpoints */
        @media (max-width: 820px) {
            .answers-grid {
                grid-template-columns: 1fr;
            }
            .question-body-text {
                font-size: 1.15rem;
            }
            .question-frame {
                padding: 50px 20px 20px 20px;
            }
        }
    </style>
</head>
<body>

<div class="main-stage">
    <!-- Watch Crest Over Question Box -->
    <div class="crest-watch-wrapper" onclick="openWatchModal()">
        <div class="pocket-watch">
            <span class="watch-lock-icon" id="watch-icon">🔒</span>
        </div>
    </div>

    <!-- Central Plaque -->
    <div class="question-frame">
        <!-- Built-in Facet Gems -->
        <div class="gems-wrapper">
            <div class="facet-gem gem-1" id="gem-0"></div>
            <div class="facet-gem gem-2" id="gem-1"></div>
            <div class="facet-gem gem-3" id="gem-2"></div>
            <div class="facet-gem gem-4" id="gem-3"></div>
            <div class="facet-gem gem-5" id="gem-4"></div>
            <div class="facet-gem gem-6" id="gem-5"></div>
        </div>

        <div class="question-header-tag">❖ QUESTION ❖</div>
        <div class="question-body-text" id="question-text">جاري تحميل السؤال...</div>
    </div>

    <!-- Answers Grid -->
    <div class="answers-grid" id="answers-grid"></div>
</div>

<!-- Modal Dialog -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
        <div class="modal-title" id="modal-title">🔐 المفهوم الشارح</div>
        <div class="modal-body" id="modal-body">جاري التحميل...</div>
        <button class="close-btn" onclick="closeWatchModal()">فهمت ذلك</button>
    </div>
</div>

<script>
    const gameData = [
        {
            conceptTitle: "الحد الفاصل للإنسان",
            conceptDetail: "يتميز الإنسان بأنه جسم نامٍ، حساس، متحرّك بالإرادة، ولكن الحد الفاصل الحقيقي الذي يميّزه عن بقية الحيوانات هو 'العقل'.",
            question: "ما هو الحد الفاصل والتام بين الإنسان والحيوان؟",
            options: ["الحس واللمس", "النمو والحركة", "العقل والمدركات الكلية", "الخيال والتصوّر"],
            correct: 2
        },
        {
            conceptTitle: "أدوات المعرفة: الوهم",
            conceptDetail: "الوهم كأداة معرفية هو إدراك المفاهيم الجزئية؛ مثل حنّو الأم على طفلها، أو خوف الشاة وإدراكها لعداوة الذئب.",
            question: "إدراك الشاة لعداوة الذئب يُعدّ مثالاً على أي أداة من أدوات المعرفة؟",
            options: ["أداة الحس", "أداة الوهم", "أداة الخيال", "أداة العقل"],
            correct: 1
        },
        {
            conceptTitle: "دليل النظام (إثبات الخالق)",
            conceptDetail: "يستحيل عقلاً تحقّق نظام متوازن ومترابط يؤدي هدفاً محدداً في هذا الكون الفسيح دون وجود قوة عالمة وقاصدة وحكيمة.",
            question: "يقوم 'دليل النظام' على فكرة أساسية وهي أن الكون:",
            options: ["تكوّن بالصدفة", "يخضع لنظام دقيق يستحيل تحققه بلا خالق", "وجد نفسه بنفسه", "ليس له أي هدف"],
            correct: 1
        },
        {
            conceptTitle: "الهدف من الخلق",
            conceptDetail: "بما أن الله تعالى 'غنيّ' لا يحتاج أحداً، وهو 'حكيم' لا يفعل عبثاً؛ فإن الهدف من خلق الإنسان هو الوصول لـ 'كماله وتكامله'.",
            question: "ما هو الهدف الأساسي من خلق الإنسان وفق الاستدلال العقلي؟",
            options: ["حاجة الخالق سبحانه", "العبث والتسلية", "تكامل الإنسان وكماله", "البقاء المادي فقط"],
            correct: 2
        },
        {
            conceptTitle: "دليل المعجزة",
            conceptDetail: "المعجزة أمر خارق للعادة الطبيعية يأتي به مدّعي النبوة للتحدي، ويُعجز البشر عن الإتيان بمثله إثباتاً لتواصله الإلهي.",
            question: "أيّ مما يلي يُعدّ من الشروط الأساسية للمعجزة؟",
            options: ["أن تكون أمراً طبيعياً", "أن تكون خارقة للأسباب الطبيعية", "أن لا تتطابق مع الدعوى", "أن تكون تجربة مخبرية"],
            correct: 1
        },
        {
            conceptTitle: "عصر التمهيد",
            conceptDetail: "وظيفة المؤمن تتلخص في مسارين: السعي للكمال الفردي (الالتزام والتقوى)، والتكامل الاجتماعي (تهيئة البيئة والتمهيد للعدالة).",
            question: "تتحدد وظيفة المؤمن في هذا العصر من خلال:",
            options: ["الكمال الفردي والتكامل الاجتماعي", "الانتظار السلبي", "الاهتمام بالنفس فقط", "اعتزال الناس"],
            correct: 0
        }
    ];

    let currentIndex = 0;

    function loadQuestion() {
        if (currentIndex >= gameData.length) {
            showEndGame();
            return;
        }

        const current = gameData[currentIndex];
        document.getElementById('question-text').innerText = current.question;
        document.getElementById('modal-title').innerText = `💡 ${current.conceptTitle}`;
        document.getElementById('modal-body').innerText = current.conceptDetail;
        document.getElementById('watch-icon').innerText = "🔒";

        const grid = document.getElementById('answers-grid');
        grid.innerHTML = '';

        current.options.forEach((opt, idx) => {
            const card = document.createElement('button');
            card.className = 'answer-card';
            card.innerText = opt;
            card.onclick = () => selectOption(idx, current.correct, card);
            grid.appendChild(card);
        });
    }

    function selectOption(selected, correct, card) {
        const allCards = document.querySelectorAll('.answer-card');
        allCards.forEach(c => c.disabled = true);

        if (selected === correct) {
            card.classList.add('correct');
            const targetGem = document.getElementById(`gem-${currentIndex}`);
            if (targetGem) targetGem.classList.add('active');
        } else {
            card.classList.add('wrong');
            allCards[correct].classList.add('correct');
        }

        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 1600);
    }

    function openWatchModal() {
        document.getElementById('watch-icon').innerText = "🔓";
        document.getElementById('modal-overlay').classList.add('active');
    }

    function closeWatchModal() {
        document.getElementById('modal-overlay').classList.remove('active');
    }

    function showEndGame() {
        document.querySelector('.main-stage').innerHTML = `
            <div style="text-align: center; padding: 50px 20px; background: rgba(13, 51, 32, 0.9); border: 3px solid var(--gold-mid); border-radius: 20px;">
                <h1 style="color: var(--gold-bright); margin-bottom: 20px;">اكتملت الرحلة بنجاح 💎</h1>
                <p style="font-size: 1.25rem; color: #ffffff; margin-bottom: 30px;">لقد أضاءت جميع الجواهر الخضراء الموزعة على إطار الأسئلة.</p>
                <button class="close-btn" onclick="location.reload()">إعادة اللعبة 🔄</button>
            </div>
        `;
    }

    loadQuestion();
</script>

</body>
          </html>
