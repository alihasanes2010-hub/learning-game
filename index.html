<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة العقل الباحث - Emerald Edition</title>
    <style>
        :root {
            --emerald-dark: #0a2318;
            --emerald-mid: #133a2a;
            --emerald-light: #256d50;
            --gold-bright: #ffd700;
            --gold-dark: #b8860b;
            --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #c5a059 50%, #8a6d3b 100%);
            --text-gold: #f4e3b1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background-color: var(--emerald-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(37, 109, 80, 0.3) 0%, rgba(10, 35, 24, 0.95) 100%),
                repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.1) 0, rgba(0, 0, 0, 0.1) 10px, transparent 10px, transparent 20px);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-gold);
            padding: 15px;
        }

        .game-frame {
            width: 100%;
            max-width: 900px;
            background: rgba(19, 58, 42, 0.85);
            border: 3px solid var(--gold-dark);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Gems Tracker */
        .gems-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .gem {
            width: 22px;
            height: 22px;
            background: #1c3328;
            border: 2px solid var(--gold-dark);
            transform: rotate(45deg);
            transition: all 0.5s ease;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .gem.active {
            background: #00ff88;
            border-color: #ffffff;
            box-shadow: 0 0 15px #00ff88, 0 0 25px #00ff88;
        }

        /* Lock Watch Trigger */
        .watch-container {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #2a5240 0%, #0d2117 100%);
            border: 4px solid var(--gold-bright);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            position: relative;
            z-index: 5;
            transition: transform 0.2s;
        }

        .watch-container:hover {
            transform: scale(1.08);
        }

        .watch-icon {
            font-size: 1.8rem;
        }

        .watch-hint {
            font-size: 0.75rem;
            color: #a3c2b2;
            margin-top: 6px;
            margin-bottom: 15px;
        }

        /* Central Question Banner */
        .question-banner {
            width: 100%;
            background: radial-gradient(circle, #1a4a36 0%, #0e2e21 100%);
            border: 2px solid var(--gold-dark);
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 5px 15px rgba(0,0,0,0.4);
            margin-bottom: 25px;
            position: relative;
        }

        .question-label {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--gold-bright);
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .question-label::before, .question-label::after {
            content: "❖";
            color: var(--gold-dark);
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #ffffff;
            font-weight: bold;
        }

        /* MCQ Options Grid */
        .options-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .option-btn {
            background: linear-gradient(180deg, #174230 0%, #0b241a 100%);
            border: 2px solid var(--gold-dark);
            border-radius: 10px;
            color: var(--text-gold);
            padding: 15px 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            text-align: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--gold-bright);
            background: linear-gradient(180deg, #256d50 0%, #133a2a 100%);
            transform: translateY(-3px);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }

        .option-btn.correct {
            background: linear-gradient(180deg, #1f7a4c 0%, #0d4227 100%) !important;
            border-color: #00ff88 !important;
            color: #ffffff !important;
        }

        .option-btn.wrong {
            background: linear-gradient(180deg, #8b1e1e 0%, #4a0d0d 100%) !important;
            border-color: #ff4d4d !important;
            color: #ffffff !important;
        }

        /* Modal Overlay for Lock Watch */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(135deg, #133a2a 0%, #0a2318 100%);
            border: 3px solid var(--gold-bright);
            border-radius: 15px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            color: var(--gold-bright);
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        .modal-body {
            font-size: 1rem;
            line-height: 1.6;
            color: #e2f0e8;
            margin-bottom: 20px;
        }

        .close-btn {
            background: var(--gold-gradient);
            border: none;
            color: #0a2318;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .options-container {
                grid-template-columns: 1fr;
            }
            .question-banner {
                padding: 18px 12px;
            }
            .question-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

<div class="game-frame">
    <!-- Gems Bar -->
    <div class="gems-container" id="gems-bar"></div>

    <!-- Watch Unlock Button -->
    <div class="watch-container" onclick="openWatchModal()">
        <span class="watch-icon" id="watch-icon">🔒</span>
    </div>
    <div class="watch-hint">اضغط على الساعة المفتوحة لكشف الفكرة 💡</div>

    <!-- Question Box -->
    <div class="question-banner">
        <div class="question-label">السؤال</div>
        <div class="question-text" id="question-text">جاري تحميل السؤال...</div>
    </div>

    <!-- Answers Grid -->
    <div class="options-container" id="options-container"></div>
</div>

<!-- Unlock Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
        <div class="modal-title" id="modal-title">🔐 المفهوم الديني/الفلسفي</div>
        <div class="modal-body" id="modal-body">جاري التحميل...</div>
        <button class="close-btn" onclick="closeWatchModal()">فهمت ذلك</button>
    </div>
</div>

<script>
    const gameData = [
        {
            conceptTitle: "الحد الفاصل للإنسان",
            conceptDetail: "يتميز الإنسان بأنه جسم نامٍ، حساس، متحرّك بالإرادة، ولكن الحد الفاصل الحقيقي الذي يميّزه عن بقية الحيوانات هو 'العقل'.",
            question: "ما هو الحد الفاصل والتام بين الإنسان والحيوان؟",
            options: ["الحس واللمس", "النمو والحركة", "العقل والمدركات الكلية", "الخيال والتصوّر"],
            correct: 2
        },
        {
            conceptTitle: "أدوات المعرفة: الوهم",
            conceptDetail: "الوهم كأداة معرفية هو إدراك المفاهيم الجزئية؛ مثل حنّو الأم على طفلها، أو خوف الشاة وإدراكها لعداوة الذئب.",
            question: "إدراك الشاة لعداوة الذئب يُعدّ مثالاً على أي أداة من أدوات المعرفة؟",
            options: ["أداة الحس", "أداة الوهم", "أداة الخيال", "أداة العقل"],
            correct: 1
        },
        {
            conceptTitle: "دليل النظام (إثبات الخالق)",
            conceptDetail: "يستحيل عقلاً تحقّق نظام متوازن ومترابط يؤدي هدفاً محدداً في هذا الكون الفسيح دون وجود قوة عالمة وقاصدة وحكيمة.",
            question: "يقوم 'دليل النظام' على فكرة أساسية وهي أن الكون:",
            options: ["تكوّن بالصدفة", "يخضع لنظام دقيق يستحيل تحققه بلا خالق", "وجد نفسه بنفسه", "ليس له أي هدف"],
            correct: 1
        },
        {
            conceptTitle: "الهدف من الخلق",
            conceptDetail: "بما أن الله تعالى 'غنيّ' لا يحتاج أحداً، وهو 'حكيم' لا يفعل عبثاً؛ فإن الهدف من خلق الإنسان هو الوصول لـ 'كماله وتكامله'.",
            question: "ما هو الهدف الأساسي من خلق الإنسان وفق الاستدلال العقلي؟",
            options: ["حاجة الخالق سبحانه", "العبث والتسلية", "تكامل الإنسان وكماله", "البقاء المادي فقط"],
            correct: 2
        },
        {
            conceptTitle: "دليل المعجزة",
            conceptDetail: "المعجزة أمر خارق للعادة الطبيعية يأتي به مدّعي النبوة للتحدي، ويُعجز البشر عن الإتيان بمثله إثباتاً لتواصله الإلهي.",
            question: "أيّ مما يلي يُعدّ من الشروط الأساسية للمعجزة؟",
            options: ["أن تكون أمراً طبيعياً", "أن تكون خارقة للأسباب الطبيعية", "أن لا تتطابق مع الدعوى", "أن تكون تجربة مخبرية"],
            correct: 1
        },
        {
            conceptTitle: "عصر التمهيد",
            conceptDetail: "وظيفة المؤمن تتلخص في مسارين: السعي للكمال الفردي (الالتزام والتقوى)، والتكامل الاجتماعي (تهيئة البيئة والتمهيد للعدالة).",
            question: "تتحدد وظيفة المؤمن في هذا العصر من خلال:",
            options: ["الكمال الفردي والتكامل الاجتماعي", "الانتظار السلبي", "الاهتمام بالنفس فقط", "اعتزال الناس"],
            correct: 0
        }
    ];

    let currentIndex = 0;

    // Build Gems Bar
    const gemsBar = document.getElementById('gems-bar');
    gameData.forEach((_, i) => {
        const gem = document.createElement('div');
        gem.className = 'gem';
        gem.id = `gem-${i}`;
        gemsBar.appendChild(gem);
    });

    function loadQuestion() {
        if (currentIndex >= gameData.length) {
            showEndGame();
            return;
        }

        const data = gameData[currentIndex];
        document.getElementById('question-text').innerText = data.question;
        document.getElementById('modal-title').innerText = `💡 ${data.conceptTitle}`;
        document.getElementById('modal-body').innerText = data.conceptDetail;
        document.getElementById('watch-icon').innerText = "🔒";

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        data.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, data.correct, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(selected, correct, btn) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        if (selected === correct) {
            btn.classList.add('correct');
            // Light up gem
            document.getElementById(`gem-${currentIndex}`).classList.add('active');
        } else {
            btn.classList.add('wrong');
            buttons[correct].classList.add('correct');
        }

        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 1500);
    }

    function openWatchModal() {
        document.getElementById('watch-icon').innerText = "🔓";
        document.getElementById('modal-overlay').classList.add('active');
    }

    function closeWatchModal() {
        document.getElementById('modal-overlay').classList.remove('active');
    }

    function showEndGame() {
        document.querySelector('.game-frame').innerHTML = `
            <div style="text-align: center; padding: 40px 10px;">
                <h1 style="color: var(--gold-bright); margin-bottom: 15px;">اكتملت الرحلة بنجاح 💎</h1>
                <p style="font-size: 1.2rem; color: #ffffff; margin-bottom: 25px;">لقد أضاءت جميع الجواهر الخضراء واستكملت محطات العقل الباحث.</p>
                <button class="close-btn" onclick="location.reload()">إعادة اللعبة 🔄</button>
            </div>
        `;
    }

    loadQuestion();
</script>

</body>
                                                                            </html>
